<script>
'use strict';
/* =====================================================================
   BALLINSTADT – Auswandererhallen Veddel, 1907
   Pixel renderer: everything is drawn on a native pixel grid (2:1 iso),
   then scaled by whole numbers. Map derived from research (RESEARCH.md).
   1 tile ≈ 5 m · 1 sim unit = 1 game minute
   ===================================================================== */

const TW2 = 12, TH2 = 6, ZU = 12;
const WB = { x0: -8, x1: 120, y0: -16, y1: 64 };
const GOX = (WB.y1 - WB.x0) * TW2 + 4, GOY = -(WB.x0 + WB.y0) * TH2 + 80;
const GW = (WB.x1 - WB.y0 + WB.y1 - WB.x0) * TW2 + 8, GH = (WB.x1 + WB.y1 - WB.x0 - WB.y0) * TH2 + 90;
const A = (x, y, z = 0) => [(x - y) * TW2 + GOX, (x + y) * TH2 - z * ZU + GOY];
const unA = (ax, ay) => { const a = (ax - GOX) / TW2, b = (ay - GOY) / TH2; return [(a + b) / 2, (b - a) / 2]; };

const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const md = (a, m) => ((a % m) + m) % m;
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function hash(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
let SEED = 1;
function srand(s) { SEED = (s >>> 0) || 1; }
function sr() { SEED ^= SEED << 13; SEED >>>= 0; SEED ^= SEED >>> 17; SEED ^= SEED << 5; SEED >>>= 0; return SEED / 4294967296; }

/* ---------------------------------------------------------------------
   PALETTE  (day; dusk and night are palette swaps)
   --------------------------------------------------------------------- */
const BASE = {
  ink: '#1d1a1f', ink2: '#3b302c', paperL: '#f3e9cf',
  sand1: '#d6c399', sand2: '#c3ad82', sand3: '#a68f67', sandA: '#d5bb95', sandA2: '#c0a27c', sandC: '#c9ad97', sandC2: '#b49480',
  pave1: '#e0d1ab', pave2: '#c9b790', pave3: '#ae9b76', paveH: '#ece0c0',
  stone1: '#b7ac97', stone2: '#998e7b', stone3: '#736a5b',
  mea1: '#98a364', mea2: '#838e52', mea3: '#65703f', mea4: '#aeb578',
  water1: '#5d8995', water2: '#4d7382', water3: '#83abb0', water4: '#3a5c6a', water5: '#b4d0cc',
  brick1: '#bd6448', brick2: '#9b4b35', brick3: '#773325', brick4: '#552318', brickH: '#d47e5e', mortar: '#8c4b37',
  plas1: '#ecdebd', plas2: '#cfbd97', plas3: '#ad9a74',
  wood1: '#7a5236', wood2: '#573924', wood3: '#382517',
  roof1: '#6a625f', roof2: '#554e4c', roof3: '#3f3a39', roofH: '#87807b',
  copper: '#6f9b86', copperD: '#4d7864',
  floor1: '#c6a371', floor2: '#ae8a5b', floor3: '#8c6d45',
  tile1: '#c8d1cb', tile2: '#a8b5b0',
  grass1: '#8da35a', grass2: '#748849', grass3: '#586b36', grass4: '#a7ba6c',
  leaf1: '#8aa653', leaf2: '#688641', leaf3: '#4b6431', leaf4: '#2f4027',
  rail: '#4a4440', metal: '#5c6767', metalL: '#8a9595',
  train1: '#46553f', train2: '#34402f', trainR: '#4b4642',
  win: '#3b4a55', winF: '#e6d8b6', lamp: '#3a3530', pool: '#d6c399', glow: '#d6c399',
  rust: '#a3432a', clean: '#5f7a3f', obs: '#8a2a22', blueM: '#3f5a73',
  white: '#f2eee4', whiteS: '#c9c3b5', bed1: '#e8e0cc', bed2: '#b8a888', blanket: '#86674a', flower: '#e8d06a'
};
function rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function hex(r, g, b) { const f = v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0'); return '#' + f(r) + f(g) + f(b); }
function shade(h, k = 0.72) { const [r, g, b] = rgb(h); return hex(r * k, g * k, b * k); }
function vt(h, v) {
  if (v === 'day') return h; const [r, g, b] = rgb(h);
  if (v === 'dusk') return hex(r * 0.76 + 12, g * 0.64 + 8, b * 0.7 + 26);
  return hex(r * 0.3 + 14, g * 0.34 + 18, b * 0.5 + 42);
}
const PALS = {};
for (const v of ['day', 'dusk', 'night']) {
  const p = {}; for (const k in BASE) p[k] = vt(BASE[k], v);
  if (v !== 'day') { p.win = v === 'night' ? '#f0c060' : '#d8a458'; p.lamp = '#ffe08a'; p.pool = v === 'night' ? '#6f6750' : '#b9a27f'; p.glow = v === 'night' ? '#8c7f5c' : '#c6ae86'; p.winF = vt(BASE.winF, v); }
  PALS[v] = p;
}
let K = PALS.day, VK = 'day';

/* ---------------------------------------------------------------------
   PIXEL PRIMITIVES (draw target D = {g, ox, oy})
   --------------------------------------------------------------------- */
let D = null;
function Q(x, y, z = 0) { const [a, b] = A(x, y, z); return [a - D.ox, b - D.oy]; }
function spans(pts, fill) {
  const g = D.g; g.fillStyle = fill;
  let minY = 1e9, maxY = -1e9; for (const p of pts) { if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }
  const n = pts.length;
  for (let y = Math.floor(minY); y < Math.ceil(maxY); y++) {
    const yc = y + 0.5, xs = [];
    for (let i = 0; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n];
      if ((a[1] <= yc && b[1] > yc) || (b[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) * (b[0] - a[0]) / (b[1] - a[1])); }
    xs.sort((p, q) => p - q);
    for (let i = 0; i + 1 < xs.length; i += 2) { const x0 = Math.round(xs[i]), x1 = Math.round(xs[i + 1]); if (x1 > x0) g.fillRect(x0, y, x1 - x0, 1); }
  }
}
function fp(w, fill) { spans(w.map(p => Q(p[0], p[1], p[2] || 0)), fill); }
function lineP(x0, y0, x1, y1, col) {
  const g = D.g; g.fillStyle = col; x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy;
  for (let i = 0; i < 4000; i++) { g.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
}
function wl(p, q, col) { const a = Q(p[0], p[1], p[2] || 0), b = Q(q[0], q[1], q[2] || 0); lineP(a[0], a[1], b[0], b[1], col); }
function px(x, y, col) { D.g.fillStyle = col; D.g.fillRect(Math.round(x), Math.round(y), 1, 1); }
function outlineC(c, col, keepInner) {
  const g = c.getContext('2d'), w = c.width, h = c.height, im = g.getImageData(0, 0, w, h), d = im.data, [r, gg, b] = rgb(col);
  const op = new Uint8Array(w * h); for (let i = 0; i < w * h; i++) op[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const i = y * w + x; if (op[i]) continue;
    if ((x > 0 && op[i - 1]) || (x < w - 1 && op[i + 1]) || (y > 0 && op[i - w]) || (y < h - 1 && op[i + w])) { d[i * 4] = r; d[i * 4 + 1] = gg; d[i * 4 + 2] = b; d[i * 4 + 3] = 255; } }
  g.putImageData(im, 0, 0);
}
function spriteFor(pts3d, draw, outline = 'ink') {
  const ps = pts3d.map(p => A(p[0], p[1], p[2] || 0));
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [a, b] of ps) { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, a); y1 = Math.max(y1, b); }
  const ox = Math.floor(x0) - 3, oy = Math.floor(y0) - 3, c = mk(x1 - ox + 4, y1 - oy + 4);
  const prev = D; D = { g: c.getContext('2d'), ox, oy }; draw(); if (outline) outlineC(c, K[outline] || outline); D = prev;
  return { c, ax: ox, ay: oy };
}

/* ---------------------------------------------------------------------
   PATTERNS (iso-sheared textures, rebuilt per palette)
   --------------------------------------------------------------------- */
let PT = {};
function mkPat(w, h, fn) { const c = mk(w, h), g = c.getContext('2d'); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const col = fn(x, y); if (col) { g.fillStyle = col; g.fillRect(x, y, 1, 1); } } return g.createPattern(c, 'repeat'); }
function coursed(base, line, joint, hi, lo, dir, ch = 3, jw = 6) {
  return (x, y) => { const v = md(y - dir * Math.floor(x / 2), ch * 2), row = Math.floor(v / ch);
    if (v % ch === 0) return line; if (joint && md(x + row * (jw / 2), jw) === 0) return joint;
    const h = hash(x * 7 + 1, y * 13 + 5); return h < 0.07 ? hi : h > 0.94 ? lo : base; };
}
function speckle(base, list) { return (x, y) => { let h = hash(x + 31, y + 17); for (const [c, p] of list) { if (h < p) return c; h -= p; } return base; }; }
function buildPatterns() {
  PT = {
    brickS: mkPat(12, 6, coursed(K.brick1, K.mortar, K.mortar, K.brickH, K.brick2, 1)),
    brickE: mkPat(12, 6, coursed(K.brick2, K.brick4, K.brick4, K.brick1, K.brick3, -1)),
    roofS: mkPat(12, 6, (x, y) => { const v = md(y - Math.floor(x / 2), 6), row = Math.floor(v / 3); if (v % 3 === 0) return K.roof3; if (v % 3 === 1) return K.roofH; return md(x + row * 2, 4) === 0 ? K.roof2 : K.roof1; }),
    roofE: mkPat(12, 6, (x, y) => { const v = md(y + Math.floor(x / 2), 6), row = Math.floor(v / 3); if (v % 3 === 0) return K.roof3; if (v % 3 === 1) return K.roof1; return md(x + row * 2, 4) === 0 ? K.roof3 : K.roof2; }),
    copS: mkPat(12, 6, coursed(K.copper, K.copperD, null, K.copper, K.copperD, 1)),
    plasS: mkPat(16, 16, speckle(K.plas1, [[K.plas2, 0.05]])),
    plasE: mkPat(16, 16, speckle(K.plas2, [[K.plas3, 0.06]])),
    floor: mkPat(12, 6, coursed(K.floor1, K.floor2, K.floor3, K.floor1, K.floor2, 1, 3, 12)),
    tiles: mkPat(8, 4, (x, y) => (md(y - Math.floor(x / 2), 4) === 0 || md(y + Math.floor(x / 2), 4) === 0) ? K.tile2 : K.tile1),
    cobble: mkPat(12, 6, coursed(K.pave1, K.pave2, K.pave2, K.paveH, K.pave3, 1, 3, 4)),
    gravel: mkPat(32, 32, speckle(K.sand1, [[K.sand2, 0.11], [K.sand3, 0.025], [K.pave1, 0.02]])),
    gravelA: mkPat(32, 32, speckle(K.sandA, [[K.sandA2, 0.12], [K.sand3, 0.025]])),
    gravelC: mkPat(32, 32, speckle(K.sandC, [[K.sandC2, 0.13], [K.sand3, 0.02]])),
    meadow: mkPat(32, 32, speckle(K.mea1, [[K.mea2, 0.17], [K.mea3, 0.04], [K.mea4, 0.06]])),
    lawn: mkPat(32, 32, speckle(K.grass1, [[K.grass2, 0.2], [K.grass3, 0.04], [K.grass4, 0.08], [K.flower, 0.004], [K.white, 0.004]])),
    stone: mkPat(12, 6, coursed(K.stone1, K.stone2, K.stone2, K.stone1, K.stone2, 1, 6, 12)),
    planks: mkPat(12, 6, coursed(K.wood1, K.wood2, null, K.wood1, K.wood2, -1, 2, 12)),
    water: mkPat(64, 32, (x, y) => { if (y % 4 === 1 && hash(Math.floor(x / 8), y) < 0.28) return K.water3; if (y % 4 === 3 && hash(Math.floor((x + 4) / 8) + 99, y) < 0.3) return K.water2; return K.water1; })
  };
}

   --------------------------------------------------------------------- */
const GLYPH_SRC = {

  I: '1 ###|.#.|.#.|.#.|.#.|###', J: '1 ..##|...#|...#|...#|#..#|.##.', K: '1 #..#|#.#.|##..|#.#.|#..#|#..#', L: '1 #...|#...|#...|#...|#...|####',

  Q: '1 .##.|#..#|#..#|#..#|#.#.|.#.#', R: '1 ###.|#..#|#..#|###.|#.#.|#..#', S: '1 .###|#...|.##.|...#|...#|###.', T: '1 ###|.#.|.#.|.#.|.#.|.#.',

  m: '3 ####.|#.#.#|#.#.#|#.#.#', n: '3 ###.|#..#|#..#|#..#', o: '3 .##.|#..#|#..#|.##.', p: '3 ###.|#..#|#..#|###.|#...|#...',
  q: '3 .###|#..#|#..#|.###|...#|...#', r: '3 #.##|##..|#...|#...', s: '3 .###|##..|..##|###.', t: '2 .#.|###|.#.|.#.|..#',

  'ä': '1 #..#|....|.###|#..#|#..#|.###', 'ö': '1 #..#|....|.##.|#..#|#..#|.##.', 'ü': '1 #..#|....|#..#|#..#|#..#|.###', 'ß': '1 .##.|#..#|#.#.|#..#|#..#|#.#.',

const GLYPH = {};
for (const ch in GLYPH_SRC) { const [t, r] = GLYPH_SRC[ch].split(' '); const rows = r.split('|'); GLYPH[ch] = { t: +t, rows, w: Math.max(...rows.map(x => x.length)) }; }
function glyphOf(ch) {
  if (GLYPH[ch]) return GLYPH[ch];
  if (ch === 'ł') return GLYPH.l; if (ch === 'Ł') return GLYPH.L;
  const b = ch.normalize('NFD').replace(/[̀-ͯ]/g, ''); if (GLYPH[b]) return GLYPH[b];
  return GLYPH['?'];

const LH = 10;
function textW(s) { let w = 0; for (const ch of s) w += (ch === ' ' ? 2 : glyphOf(ch).w) + 1; return Math.max(0, w - 1); }
function drawText(g, s, x, y, col, sc = 1) {
  g.fillStyle = col; let cx = x;
  for (const ch of s) { if (ch === ' ') { cx += 3 * sc; continue; } const G = glyphOf(ch);
    for (let r = 0; r < G.rows.length; r++) { const row = G.rows[r]; for (let c = 0; c < row.length; c++) if (row[c] === '#') g.fillRect(cx + c * sc, y + (G.t + r) * sc, sc, sc); }
    cx += (G.w + 1) * sc; }
  return cx - x;
}
function drawTextHalo(g, s, x, y, col, halo, sc = 1) { for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) drawText(g, s, x + dx, y + dy, halo, sc); drawText(g, s, x, y, col, sc); }
const TC = new Map();
function tc(s, col, sc = 1, halo = null) {
  const key = s + '\u0001' + col + sc + (halo || ''); let c = TC.get(key); if (c) return c;
  const p = halo ? 1 : 0; c = mk(textW(s) * sc + 2 * p + 1, 9 * sc + 2 * p); const g = c.getContext('2d');
  if (halo) drawTextHalo(g, s, p, p, col, halo, sc); else drawText(g, s, 0, 0, col, sc);
  if (TC.size > 900) TC.clear(); TC.set(key, c); return c;
}
function wrap(s, maxW) {
  const out = []; for (const para of String(s).split('\n')) { let line = '';
    for (const w of para.split(' ')) { const t = line ? line + ' ' + w : w; if (textW(t) <= maxW || !line) line = t; else { out.push(line); line = w; } }
    out.push(line); } return out;
}

/* ---------------------------------------------------------------------
   WORLD DATA – taken from the overview plan of 1907
   („Hamburg-Amerika Linie. Übersichtsplan der Auswandererhallen", Tafel Ia).
   The plan is drawn with south at the top. Plan pixel (1800-px scan) → world:
     x = (1520 − px) / 12.5   (east)      y = (800 − py) / 12.5   (south)
